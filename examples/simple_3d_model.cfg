# 3D Simple Box Model Configuration
# This demonstrates a basic 3D simulation setup

# Simulation parameters
sim.modelname = box_3d
sim.max_steps = 1000
sim.output_step_interval = 20
sim.output_averaged_fields = 0
sim.max_time_in_yr = 1e6  # 1 million years

# Mesh parameters (3D requires ylength)
mesh.meshing_option = 1
mesh.xlength = 100e3     # 100 km width (x)
mesh.ylength = 100e3     # 100 km length (y)
mesh.zlength = 50e3      # 50 km depth (z)
mesh.resolution = 10e3   # 10 km resolution (coarse for this example)
mesh.min_tet_angle = 22  # Minimum tetrahedral angle for 3D
mesh.max_ratio = 2       # Max radius/length ratio for 3D

# Material properties
mat.rheology_type = elastic
mat.num_materials = 1
mat.rho0 = [3300]                   # Density (kg/m³)
mat.thermal_coefficient = [3e-5]    # Thermal expansion coefficient (1/K)
mat.bulk_modulus = [130e9]          # Bulk modulus (Pa)
mat.shear_modulus = [70e9]          # Shear modulus (Pa)

# Control parameters
control.gravity = 9.81              # m/s²
control.is_quasi_static = true

# Boundary conditions - simple extension in x and shortening in y
bc.vbc_x0 = 1                       # Fix normal velocity on left (x=0)
bc.vbc_x1 = 1                       # Fix normal velocity on right (x=max)
bc.vbc_val_x0 = -1e-9               # 1 cm/yr extension (left)
bc.vbc_val_x1 = 1e-9                # 1 cm/yr extension (right)

bc.vbc_y0 = 1                       # Fix normal velocity on front (y=0)
bc.vbc_y1 = 1                       # Fix normal velocity on back (y=max)
bc.vbc_val_y0 = 0.5e-9              # 0.5 cm/yr shortening (front)
bc.vbc_val_y1 = -0.5e-9             # 0.5 cm/yr shortening (back)

bc.vbc_z0 = 0                       # Free bottom boundary
bc.vbc_z1 = 0                       # Free top boundary

# Temperature boundary conditions
bc.surface_temperature = 273        # Surface at 0°C
bc.mantle_temperature = 1600        # Mantle at 1327°C