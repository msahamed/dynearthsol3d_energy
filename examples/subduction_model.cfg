# 2D Subduction Model Configuration
# This simulates oceanic plate subduction beneath a continental plate
# Designed for studying subduction dynamics

# Simulation parameters
sim.modelname = subduction_model
sim.max_steps = 10000
sim.output_step_interval = 100
sim.output_averaged_fields = 100
sim.max_time_in_yr = 10e6  # 10 million years
sim.checkpoint_frame_interval = 5

# Mesh parameters
mesh.meshing_option = 90
mesh.poly_filename = .rifting-2d.poly  # Use included geometry or create your own
mesh.xlength = 500e3     # 500 km width
mesh.zlength = 200e3     # 200 km depth
mesh.ylength = 0     # 200 km depth
mesh.resolution = 500    # 500 resolution
mesh.min_angle = 28

# Material properties - continental crust, oceanic crust, and mantle
mat.rheology_type = elasto-visco-plastic
mat.num_materials = 3
mat.rho0 = [2800, 3000, 3300]                       # Density [cont, ocean, mantle] (kg/m³)
mat.thermal_coefficient = [3e-5, 3e-5, 2.5e-5]      # Thermal expansion coefficient (1/K)
mat.bulk_modulus = [50e9, 70e9, 130e9]              # Bulk modulus (Pa)
mat.shear_modulus = [30e9, 40e9, 70e9]              # Shear modulus (Pa)
mat.visc_coefficient = [1e-15, 1e-15, 1e-13]        # Viscosity coefficient
mat.visc_exponent = [3.0, 3.0, 3.5]                 # Viscosity exponent
mat.visc_activation_energy = [3.5e5, 3.5e5, 5.4e5]  # Activation energy (J/mol)
mat.heat_capacity = [1000, 1000, 1200]              # Heat capacity (J/kg/K)
mat.therm_cond = [3.0, 3.0, 3.5]                    # Thermal conductivity (W/m/K)
mat.pls0 = [0, 0, 0]                                # Plastic strain start
mat.pls1 = [0.1, 0.1, 0.1]                          # Plastic strain saturation
mat.cohesion0 = [2e7, 2e7, 5e7]                     # Initial cohesion (Pa)
mat.cohesion1 = [1e6, 1e6, 2e7]                     # Weakened cohesion (Pa)
mat.friction_angle0 = [30, 30, 30]                  # Initial friction angle (degrees)
mat.friction_angle1 = [5, 5, 15]                    # Weakened friction angle (degrees)

# Initial conditions - use polygon file regional attributes for initial material distribution
ic.mattype_option = 0                               # Use regional attributes

# Add a weak zone along the subduction interface
ic.weakzone_option = 1
ic.weakzone_plstrain = 0.2
ic.weakzone_inclination = 30                        # 30-degree dipping interface
ic.weakzone_halfwidth = 3                           # Width in mesh resolution units
ic.weakzone_xcenter = 0.3                           # At 30% of model width
ic.weakzone_depth_min = 0                           # From surface
ic.weakzone_depth_max = 0.5                         # To half depth

# Phase changes for subduction processes
mat.phase_change_option = 0                         # Enable subduction phase changes

# Thermal structure
ic.temperature_option = 0                           # Half-space cooling
ic.oceanic_plate_age_in_yr = 80e6                   # 80 million years

# Control parameters
control.gravity = 9.81                              # m/s²
control.has_thermal_diffusion = true
control.is_quasi_static = true
control.dt_fraction = 0.8                           # Reduced time step for stability

# Boundary conditions - convergent
bc.vbc_x0 = 1                                       # Fix normal velocity on left
bc.vbc_x1 = 1                                       # Fix normal velocity on right
bc.vbc_val_x0 = 2e-9                                # 2 cm/yr convergence (left)
bc.vbc_val_x1 = 0                                   # Fixed right boundary
bc.vbc_z0 = 0                                       # Free bottom boundary
bc.vbc_z1 = 0                                       # Free top boundary
bc.surface_temperature = 273                        # Surface at 0°C
bc.mantle_temperature = 1600                        # Mantle at 1327°C
bc.has_wrinkler_foundation = true                   # Enable isostasy at bottom
bc.has_water_loading = true                         # Enable water loading on top