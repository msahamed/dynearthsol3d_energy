# 2D Thermal Convection Model Configuration
# This simulates thermal convection in the mantle

# Simulation parameters
sim.modelname = thermal_convection
sim.max_steps = 50000
sim.output_step_interval = 100
sim.output_averaged_fields = 100
sim.max_time_in_yr = 100e6  # 100 million years

# Mesh parameters
mesh.meshing_option = 1
mesh.xlength = 1000e3    # 1000 km width
mesh.zlength = 500e3     # 500 km depth
mesh.resolution = 10e3   # 10 km resolution
mesh.min_angle = 30

# Material properties - mantle
mat.rheology_type = elasto-visco-plastic
mat.num_materials = 1
mat.rho0 = [3300]                   # Density (kg/m³)
mat.thermal_coefficient = [3e-5]    # Thermal expansion coefficient (1/K)
mat.bulk_modulus = [130e9]          # Bulk modulus (Pa)
mat.shear_modulus = [70e9]          # Shear modulus (Pa)
mat.visc_coefficient = [1e-13]      # Viscosity coefficient
mat.visc_exponent = [3.5]           # Viscosity exponent
mat.visc_activation_energy = [5.4e5] # Activation energy (J/mol)
mat.heat_capacity = [1200]          # Heat capacity (J/kg/K)
mat.therm_cond = [3.5]              # Thermal conductivity (W/m/K)

# Initial conditions
# Add a thermal perturbation to initiate convection
ic.temperature_option = 0           # Half-space cooling
ic.oceanic_plate_age_in_yr = 0      # No cooling age (will be overridden)

# Add a thermal anomaly in the center-bottom of the model
ic.weakzone_option = 2              # Ellipsoidal weak zone (thermal anomaly)
ic.weakzone_plstrain = 0            # No plastic strain
ic.weakzone_xcenter = 0.5           # Center of model
ic.weakzone_zcenter = 0.8           # Near bottom
ic.weakzone_xsemi_axis = 50e3       # 50 km x radius
ic.weakzone_zsemi_axis = 50e3       # 50 km z radius

# Control parameters
control.gravity = 9.81              # m/s²
control.has_thermal_diffusion = true
control.is_quasi_static = true
control.dt_fraction = 0.2           # Small time step for stability

# Boundary conditions - closed box with thermal gradient
bc.vbc_x0 = 3                       # Left wall fixed (normal and shear)
bc.vbc_x1 = 3                       # Right wall fixed (normal and shear)
bc.vbc_z0 = 3                       # Bottom fixed (normal and shear)
bc.vbc_z1 = 3                       # Top fixed (normal and shear)
bc.vbc_val_x0 = 0                   # No velocity
bc.vbc_val_x1 = 0                   # No velocity
bc.vbc_val_z0 = 0                   # No velocity
bc.vbc_val_z1 = 0                   # No velocity

# Thermal boundary conditions - fixed temperature top and bottom
bc.surface_temperature = 273        # Top at 0°C
bc.mantle_temperature = 2000        # Bottom at 1727°C