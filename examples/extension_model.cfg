# 2D Extension Model Configuration
# This simulates lithospheric extension with a weak zone in the center
# Designed for studying continental rifting

# Simulation parameters
sim.modelname = extension_model
sim.max_steps = 5000
sim.output_step_interval = 50
sim.output_averaged_fields = 100
sim.max_time_in_yr = 5e6  # 5 million years

# Mesh parameters
mesh.meshing_option = 1
mesh.xlength = 200e3     # 200 km width
mesh.zlength = 100e3     # 100 km depth
mesh.resolution = 2e3    # 2 km resolution
mesh.min_angle = 30

# Material properties - lithosphere and asthenosphere
mat.rheology_type = elasto-visco-plastic
mat.num_materials = 2
mat.rho0 = [2800, 3300]                      # Density [crust, mantle] (kg/m³)
mat.thermal_coefficient = [3e-5, 2.5e-5]     # Thermal expansion coefficient (1/K)
mat.bulk_modulus = [50e9, 130e9]             # Bulk modulus (Pa)
mat.shear_modulus = [30e9, 70e9]             # Shear modulus (Pa)
mat.visc_coefficient = [1e-15, 1e-13]        # Viscosity coefficient
mat.visc_exponent = [3.0, 3.5]               # Viscosity exponent
mat.visc_activation_energy = [3.5e5, 5.4e5]  # Activation energy (J/mol)
mat.heat_capacity = [1000, 1200]             # Heat capacity (J/kg/K)
mat.therm_cond = [3.0, 3.5]                  # Thermal conductivity (W/m/K)
mat.pls0 = [0, 0]                            # Plastic strain start
mat.pls1 = [0.1, 0.1]                        # Plastic strain saturation
mat.cohesion0 = [2e7, 5e7]                   # Initial cohesion (Pa)
mat.cohesion1 = [1e6, 2e7]                   # Weakened cohesion (Pa)
mat.friction_angle0 = [30, 30]               # Initial friction angle (degrees)
mat.friction_angle1 = [5, 15]                # Weakened friction angle (degrees)

# Initial conditions
ic.mattype_option = 1
ic.num_mattype_layers = 2
ic.layer_mattypes = [0, 1]                   # [crust, mantle]
ic.mattype_layer_depths = [0.3]              # Interface at 30% of depth (30 km)

# Weak zone in the center to initiate rifting
ic.weakzone_option = 1
ic.weakzone_plstrain = 0.2
ic.weakzone_inclination = 90                 # Vertical weak zone
ic.weakzone_halfwidth = 5                    # Width in mesh resolution units
ic.weakzone_xcenter = 0.5                    # Center of the model
ic.weakzone_depth_min = 0                    # From surface
ic.weakzone_depth_max = 0.3                  # Down to crust-mantle boundary

# Thermal structure
ic.temperature_option = 0                    # Half-space cooling
ic.oceanic_plate_age_in_yr = 50e6            # 50 million years

# Control parameters
control.gravity = 9.81                       # m/s²
control.has_thermal_diffusion = true
control.is_quasi_static = true

# Boundary conditions - extensional
bc.vbc_x0 = 1                                # Fix normal velocity on left
bc.vbc_x1 = 1                                # Fix normal velocity on right
bc.vbc_val_x0 = -5e-10                       # 0.5 cm/yr extensional (left)
bc.vbc_val_x1 = 5e-10                        # 0.5 cm/yr extensional (right)
bc.vbc_z0 = 0                                # Free bottom boundary
bc.vbc_z1 = 0                                # Free top boundary
bc.surface_temperature = 273                 # Surface at 0°C
bc.mantle_temperature = 1600                 # Mantle at 1327°C