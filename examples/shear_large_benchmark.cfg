# 2D Shear Zone Model - Large Benchmark Configuration
# Designed to demonstrate OpenMP performance benefits

# Simulation parameters
sim.modelname = shear_large
sim.max_steps = 2000              # 10x more steps
sim.output_step_interval = 500    # Output every 500 steps
sim.output_averaged_fields = 0
sim.max_time_in_yr = 1e7          # 10 million years

# Mesh parameters - FINER MESH
mesh.meshing_option = 1
mesh.xlength = 60e3               # 60 km width
mesh.ylength = 1e3                # 1 km thickness (required for 2D)
mesh.zlength = 20e3               # 20 km depth
mesh.resolution = 400             # 400m resolution (2x finer → 4x more elements)
mesh.min_angle = 30

# Material properties
mat.rheology_type = elasto-plastic
mat.phase_change_option = 0
mat.num_materials = 1
mat.rho0 = [2700]
mat.thermal_coefficient = [3e-5]
mat.bulk_modulus = [50e9]
mat.shear_modulus = [30e9]
mat.cohesion0 = [4e7]
mat.cohesion1 = [4e6]
mat.friction_angle0 = [30]
mat.friction_angle1 = [15]
mat.dilation_angle0 = [0]
mat.dilation_angle1 = [0]
mat.pls0 = [0]
mat.pls1 = [0.5]

# Initial conditions
ic.weakzone_option = 2
ic.weakzone_plstrain = 0.1
ic.weakzone_y_min = -1e3
ic.weakzone_y_max = 1e3
ic.weakzone_depth_min = 0
ic.weakzone_depth_max = 20e3
ic.weakzone_azimuth = 0
ic.weakzone_inclination = 60
ic.weakzone_halfwidth = 500

# Control parameters
control.gravity = 10
control.is_quasi_static = 1
control.damping_factor = 0.9

# Boundary conditions
bc.vbc_x0 = -1.0e-9                 # Extension on left
bc.vbc_x1 = 1.0e-9                  # Extension on right
bc.vbc_z0 = 0                     # Fixed bottom
bc.vbc_z1 = 0                     # Free surface
bc.surface_temperature = 273
bc.mantle_temperature = 1600
